<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthMark – Cookie Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background-color:#121212;
  color:#f0f0f0;
  font-family:Segoe UI, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  margin:0;
}
button {
  background:#1f1f1f;
  color:#00ffd5;
  border:2px solid #00ffd5;
  border-radius:8px;
  padding:10px 20px;
  margin:6px 0;
  cursor:pointer;
}
button:hover {
  background:#00ffd5;
  color:#121212;
}
</style>
</head>

<body>
<h1>AuthMark</h1>
<p id="status">Checking authentication…</p>
<div id="login-buttons"></div>

<script>
/* ================= CONFIG ================= */
const COOKIE_PREFIX = 'accid_';
const CLOUDFLARE_WORKER =
  'https://authmarkbackend.stuffzez-yt-mail068324.workers.dev';

/* ================= PARAMS ================= */
const params = new URLSearchParams(window.location.search);

const fwaccEncoded = params.get('fwacc');
const fwacc = fwaccEncoded ? decodeURIComponent(fwaccEncoded) : null;

const accid = params.get('accid');
const provider = params.get('provider');

const statusEl = document.getElementById('status');
const buttonsEl = document.getElementById('login-buttons');

/* ================= HELPERS ================= */
function setCookie(name, value, days = 365) {
  const expires = new Date();
  expires.setTime(expires.getTime() + days * 864e5);
  document.cookie =
    `${name}=${value}; path=/; expires=${expires.toUTCString()}; SameSite=Lax; Secure`;
}

function login(provider) {
  const url =
    `${CLOUDFLARE_WORKER}/login/${provider}?fwacc=${encodeURIComponent(fwacc)}`;
  window.location.href = url;
}

/* ================= FLOW ================= */

// Returned from OAuth
if (accid && provider && fwacc) {
  // Store provider-specific cookie ONLY on this domain
  setCookie(COOKIE_PREFIX + provider, accid);

  // Forward generic accid to fwacc site
  const redirectUrl = new URL(fwacc);
  redirectUrl.searchParams.set('accid', accid);

  statusEl.textContent = `Logged in with ${provider}. Redirecting…`;
  setTimeout(() => {
    window.location.href = redirectUrl.toString();
  }, 500);
}

// Auto-login if provider specified
else if (fwacc && provider) {
  statusEl.textContent = `Logging in with ${provider}…`;
  login(provider);
}

// Show provider chooser
else if (fwacc) {
  statusEl.textContent = 'Choose a login provider';
  buttonsEl.innerHTML = `
    <button onclick="login('google')">Login with Google</button>
    <button onclick="login('github')">Login with GitHub</button>
    <button onclick="login('microsoft')">Login with Microsoft</button>
    <button onclick="login('discord')">Login with Discord</button>
  `;
}

// Invalid entry
else {
  statusEl.textContent =
    'Missing fwacc parameter. This page must be opened from an AuthMark-enabled site.';
}
</script>
</body>
</html>
