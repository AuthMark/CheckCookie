<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthMark – CookieCheck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background:#121212;
  color:#f0f0f0;
  font-family:Segoe UI, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
button {
  background:#1f1f1f;
  color:#00ffd5;
  border:2px solid #00ffd5;
  border-radius:8px;
  padding:10px 20px;
  margin:6px 0;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>AuthMark</h1>
<p id="status">Checking authentication…</p>
<div id="buttons"></div>

<script>
/* ================= CONFIG ================= */
const COOKIE_PREFIX = 'accid_';
const CLOUDFLARE =
  'https://authmarkbackend.stuffzez-yt-mail068324.workers.dev';

/* ================= PARAMS ================= */
const params = new URLSearchParams(window.location.search);
const fwaccEncoded = params.get('fwacc');
const fwacc = fwaccEncoded ? decodeURIComponent(fwaccEncoded) : null;
const provider = params.get('provider');
const accidFromUrl = params.get('accid');

const status = document.getElementById('status');
const buttons = document.getElementById('buttons');

/* ================= HELPERS ================= */
function getCookie(name) {
  const v = `; ${document.cookie}`;
  const p = v.split(`; ${name}=`);
  return p.length === 2 ? p.pop().split(';')[0] : null;
}

function setCookie(name, value) {
  const exp = new Date();
  exp.setFullYear(exp.getFullYear() + 1);
  document.cookie =
    `${name}=${value}; path=/; expires=${exp.toUTCString()}; SameSite=Lax; Secure`;
}

function redirectToWebsite(accid) {
  const url = new URL(fwacc);
  url.searchParams.set('accid', accid);
  window.location.href = url.toString();
}

function loginViaCloudflare(provider) {
  window.location.href =
    `${CLOUDFLARE}/login/${provider}?fwacc=${encodeURIComponent(fwacc)}`;
}

/* ================= FLOW ================= */

// Safety check
if (!fwacc || !provider) {
  status.textContent = 'Invalid request.';
}

/*
 STEP A:
 Returned from Cloudflare with accid
*/
else if (accidFromUrl) {
  setCookie(COOKIE_PREFIX + provider, accidFromUrl);
  status.textContent = 'Login successful. Redirecting…';
  redirectToWebsite(accidFromUrl);
}

/*
 STEP B:
 Already logged in with this provider → skip Cloudflare
*/
else {
  const existingAccid = getCookie(COOKIE_PREFIX + provider);

  if (existingAccid) {
    status.textContent = 'Already authenticated. Redirecting…';
    redirectToWebsite(existingAccid);
  }

  /*
   STEP C:
   Not logged in → go to Cloudflare
  */
  else {
    status.textContent = `Logging in with ${provider}…`;
    loginViaCloudflare(provider);
  }
}
</script>

</body>
</html>
