<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthMark – CookieCheck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background:#121212;
  color:#f0f0f0;
  font-family:Segoe UI, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
button {
  background:#1f1f1f;
  color:#00ffd5;
  border:2px solid #00ffd5;
  border-radius:8px;
  padding:10px 20px;
  margin:6px 0;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>AuthMark</h1>
<p id="status">Checking authentication…</p>
<div id="buttons"></div>

<script>
const COOKIE_PREFIX = 'accid_';
const CLOUDFLARE =
  'https://authmarkbackend.stuffzez-yt-mail068324.workers.dev';

const params = new URLSearchParams(window.location.search);

const fwaccEncoded = params.get('fwacc');
const fwacc = fwaccEncoded ? decodeURIComponent(fwaccEncoded) : null;
const provider = params.get('provider');
const accid = params.get('accid');

const status = document.getElementById('status');
const buttons = document.getElementById('buttons');

function setCookie(name, value) {
  const expires = new Date();
  expires.setFullYear(expires.getFullYear() + 1);
  document.cookie =
    `${name}=${value}; path=/; expires=${expires.toUTCString()}; SameSite=Lax; Secure`;
}

function login(provider) {
  window.location.href =
    `${CLOUDFLARE}/login/${provider}?fwacc=${encodeURIComponent(fwacc)}`;
}

/* ================= FLOW ================= */

// STEP 4 → 5 (Cloudflare → CheckCookie with accid)
if (accid && provider && fwacc) {
  // Store provider-specific cookie ONLY here
  setCookie(COOKIE_PREFIX + provider, accid);

  // Forward accid to WEBSITE
  const redirect = new URL(fwacc);
  redirect.searchParams.set('accid', accid);

  status.textContent = 'Login successful. Redirecting…';
  setTimeout(() => {
    window.location.href = redirect.toString();
  }, 500);
}

// STEP 2 → 3 (Website → CheckCookie → Cloudflare)
else if (fwacc && provider) {
  status.textContent = `Logging in with ${provider}…`;
  login(provider);
}

// Provider chooser
else if (fwacc) {
  status.textContent = 'Choose a provider';
  buttons.innerHTML = `
    <button onclick="login('google')">Google</button>
    <button onclick="login('github')">GitHub</button>
    <button onclick="login('microsoft')">Microsoft</button>
    <button onclick="login('discord')">Discord</button>
  `;
}

else {
  status.textContent = 'Invalid request.';
}
</script>

</body>
</html>
