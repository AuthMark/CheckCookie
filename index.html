<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthMark – CookieCheck</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background:#121212;
  color:#f0f0f0;
  font-family:Segoe UI, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
button {
  background:#1f1f1f;
  color:#00ffd5;
  border:2px solid #00ffd5;
  border-radius:8px;
  padding:10px 20px;
  margin:6px 0;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>AuthMark</h1>
<p id="status">Checking authentication…</p>
<div id="buttons"></div>

<script>
/* ================= CONFIG ================= */
const COOKIE_NAME = 'accid';                          // ← unified: no prefix
const CLOUDFLARE =
  'https://authmarkbackend.stuffzez-yt-mail068324.workers.dev';

/* ================= PARAMS ================= */
const params = new URLSearchParams(window.location.search);
const fwaccEncoded = params.get('fwacc');
const fwacc = fwaccEncoded ? decodeURIComponent(fwaccEncoded) : null;
const provider  = params.get('provider');
const accidFromUrl = params.get('accid');

const status  = document.getElementById('status');
const buttons = document.getElementById('buttons');

/* ================= HELPERS ================= */
function getCookie(name) {
  const v = `; ${document.cookie}`;
  const p = v.split(`; ${name}=`);
  return p.length === 2 ? p.pop().split(';')[0] : null;
}

function setCookie(name, value) {
  const exp = new Date();
  exp.setFullYear(exp.getFullYear() + 1);
  document.cookie =
    `${name}=${value}; path=/; expires=${exp.toUTCString()}; SameSite=Lax; Secure`;
}

function redirectToWebsite(accid) {
  const url = new URL(fwacc);
  url.searchParams.set('accid', accid);
  window.location.href = url.toString();
}

function loginViaCloudflare(prov) {
  window.location.href =
    `${CLOUDFLARE}/login/${prov}?fwacc=${encodeURIComponent(fwacc)}`;
}

/* ================= FLOW ================= */

/*
 STEP A — returned from Cloudflare with accid.
 Only needs fwacc + accid; provider is NOT required here.
*/
if (fwacc && accidFromUrl) {
  setCookie(COOKIE_NAME, accidFromUrl);
  status.textContent = 'Login successful. Redirecting…';
  redirectToWebsite(accidFromUrl);
}

/*
 STEP B — already logged in (cookie exists) → skip straight back.
 Only needs fwacc; provider is NOT required here either.
*/
else if (fwacc && getCookie(COOKIE_NAME)) {
  status.textContent = 'Already authenticated. Redirecting…';
  redirectToWebsite(getCookie(COOKIE_NAME));
}

/*
 STEP C — not logged in, provider given → go to Cloudflare.
 Needs both fwacc AND provider.
*/
else if (fwacc && provider) {
  status.textContent = `Logging in with ${provider}…`;
  loginViaCloudflare(provider);
}

/*
 Fallback — missing required params for whichever step we're on.
*/
else {
  status.textContent = 'Invalid request.';
}
</script>

</body>
</html>
